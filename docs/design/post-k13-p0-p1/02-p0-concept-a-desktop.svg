<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="800" viewBox="0 0 1300 800" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <title>P0 Concept A — Touched-first disclosure plus an on-demand ámbito lattice (desktop 1440x900)</title>
  <desc>Annotated wireframe of proposed Concept A on desktop: the membership answer promoted into the planning section, and an All planning ámbitos option on the existing boundary select that draws a stroke-only lattice. Proposed design, not implemented.</desc>

  <rect width="1300" height="800" fill="#060c14"/>

  <text x="20" y="30" fill="#f3f7ff" font-size="19" font-weight="700">P0 CONCEPT A · “Touched first, lattice on demand”</text>
  <text x="20" y="52" fill="#9fb1c5" font-size="13">Desktop 1440 × 900 · PLACE · same cold start, same Lens, same camera · shows P0-a (membership) AND P0-b1 (lattice), now SEPARATELY GATED increments</text>
  <text x="20" y="72" fill="#ffb04a" font-size="12">PROPOSED — not implemented. P0-a is GO; the lattice (P0-b1) is CONDITIONAL on the direct benchmarks in §6.4. No new programmatic camera move; no new dataset.</text>

