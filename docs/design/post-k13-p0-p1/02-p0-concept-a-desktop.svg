  <rect x="876" y="658" width="76" height="24" rx="5" fill="#0b1521" stroke="#2a3442"/><text x="914" y="674" fill="#d9e4ef" font-size="9" text-anchor="middle">Reset</text>

  <!-- callouts -->
  <rect x="1046" y="88" width="238" height="630" rx="8" fill="#0a131f" stroke="#2a3442"/>
  <text x="1058" y="110" fill="#f3f7ff" font-size="12" font-weight="700">WHAT CONCEPT A CHANGES</text>

  <circle cx="1066" cy="134" r="9" fill="#43d7ff"/><text x="1066" y="138" fill="#060c14" font-size="10" font-weight="700" text-anchor="middle">A</text>
  <text x="1082" y="132" fill="#f3f7ff" font-size="10" font-weight="700">Promote the membership</text>
  <text x="1082" y="144" fill="#f3f7ff" font-size="10" font-weight="700">answer</text>
  <text x="1082" y="158" fill="#9fb1c5" font-size="9">ambitosIntersecting() already</text>
  <text x="1082" y="170" fill="#9fb1c5" font-size="9">returns the 9. Render it directly</text>
  <text x="1082" y="182" fill="#9fb1c5" font-size="9">under the containment line, not</text>
  <text x="1082" y="194" fill="#9fb1c5" font-size="9">inside a closed &lt;details&gt;.</text>
  <text x="1082" y="208" fill="#ffb04a" font-size="8.5">No NEW model call — but a real</text>
  <text x="1082" y="219" fill="#ffb04a" font-size="8.5">per-interaction cost, because it</text>
  <text x="1082" y="230" fill="#ffb04a" font-size="8.5">runs where it did not. See §5.5.</text>

  <circle cx="1066" cy="234" r="9" fill="#43d7ff"/><text x="1066" y="238" fill="#060c14" font-size="10" font-weight="700" text-anchor="middle">B</text>
  <text x="1082" y="232" fill="#f3f7ff" font-size="10" font-weight="700">Lattice as a 4th boundary</text>
  <text x="1082" y="244" fill="#f3f7ff" font-size="10" font-weight="700">option</text>
  <text x="1082" y="258" fill="#9fb1c5" font-size="9">A NEW renderer over</text>
  <text x="1082" y="270" fill="#9fb1c5" font-size="9">planningIndex.entries — not a</text>
  <text x="1082" y="282" fill="#9fb1c5" font-size="9">reuse of renderPlanningPolygon</text>
  <text x="1082" y="294" fill="#9fb1c5" font-size="9">and not a pane toggle. Opt-in,</text>
  <text x="1082" y="306" fill="#9fb1c5" font-size="9">OFF by default.</text>

  <circle cx="1066" cy="332" r="9" fill="#43d7ff"/><text x="1066" y="336" fill="#060c14" font-size="10" font-weight="700" text-anchor="middle">C</text>
  <text x="1082" y="330" fill="#f3f7ff" font-size="10" font-weight="700">Stroke-only, dashed,</text>
  <text x="1082" y="342" fill="#f3f7ff" font-size="10" font-weight="700">neutral</text>
  <text x="1082" y="356" fill="#9fb1c5" font-size="9">--planning-neutral #aeb8c4, no</text>
  <text x="1082" y="368" fill="#9fb1c5" font-size="9">fill at lattice scale, so it cannot</text>
  <text x="1082" y="380" fill="#9fb1c5" font-size="9">read as a built footprint. Fill</text>
  <text x="1082" y="392" fill="#9fb1c5" font-size="9">appears only on the touched set.</text>

  <circle cx="1066" cy="418" r="9" fill="#43d7ff"/><text x="1066" y="422" fill="#060c14" font-size="10" font-weight="700" text-anchor="middle">D</text>
  <text x="1082" y="416" fill="#f3f7ff" font-size="10" font-weight="700">Chip ⇄ map, no camera</text>
  <text x="1082" y="430" fill="#9fb1c5" font-size="9">Hovering or focusing a chip</text>
  <text x="1082" y="442" fill="#9fb1c5" font-size="9">highlights that ámbito on the map.</text>
  <text x="1082" y="454" fill="#9fb1c5" font-size="9">No NEW programmatic camera move.</text>
  <text x="1082" y="466" fill="#9fb1c5" font-size="9">Ordinary pan/zoom is unchanged.</text>

  <line x1="1058" y1="486" x2="1272" y2="486" stroke="#2a3442"/>
  <text x="1058" y="504" fill="#ffb04a" font-size="10.5" font-weight="700">WHAT A DOES NOT SOLVE</text>
  <text x="1058" y="520" fill="#d9e4ef" font-size="9">· If the user pans to a genuinely</text>
  <text x="1058" y="532" fill="#d9e4ef" font-size="9">  uncovered area, the lattice is</text>
  <text x="1058" y="544" fill="#d9e4ef" font-size="9">  empty and there is still no route</text>
  <text x="1058" y="556" fill="#d9e4ef" font-size="9">  to a particular ámbito.</text>
  <text x="1058" y="572" fill="#d9e4ef" font-size="9">· No keyboard-only route that</text>
  <text x="1058" y="584" fill="#d9e4ef" font-size="9">  avoids the map entirely.</text>
  <text x="1058" y="600" fill="#d9e4ef" font-size="9">· #93 wants an overview OR a</text>
  <text x="1058" y="612" fill="#d9e4ef" font-size="9">  locate action. The lattice</text>
  <text x="1058" y="624" fill="#d9e4ef" font-size="9">  control IS the overview.</text>
  <text x="1058" y="644" fill="#43d7ff" font-size="9" font-weight="700">→ B only if O3 or the study fails.</text>

  <rect x="1058" y="656" width="214" height="50" rx="5" fill="#101d2c" stroke="#70dea4" stroke-dasharray="3 3"/>
  <text x="1066" y="672" fill="#70dea4" font-size="9" font-weight="700">A STANDS ALONE</text>
  <text x="1066" y="685" fill="#d9e4ef" font-size="8.5">P0-a alone fixes the comprehension</text>
  <text x="1066" y="696" fill="#d9e4ef" font-size="8.5">gap at the default view on D/T/P.</text>

  <text x="20" y="742" fill="#6d7f93" font-size="10">The K12 harness rendered a RELATED 724-feature layer (leaflet_baseline.html:71) — filled, interactive, unculled, bare shell. It is a PRECEDENT, not a benchmark of this renderer.</text>
  <text x="20" y="758" fill="#6d7f93" font-size="10">iPad M3 / Safari pan p95 ≤ 30 ms; Windows Intel UHD 620 143–311 ms (failing). §6.4 requires a direct baseline-vs-prototype run; a supported class that cannot pass means HOLD.</text>
  <text x="20" y="774" fill="#6d7f93" font-size="10">Figures 41 / 63 / 24 and the chip codes shown are illustrative layout placeholders, not evidence readings. The 9-ámbito count IS model-derived.</text>
  <text x="20" y="790" fill="#6d7f93" font-size="10">NOT TESTED: no human user, no real hardware, no assistive technology. Proposed design only.</text>
</svg>
