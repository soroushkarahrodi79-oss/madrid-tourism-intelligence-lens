name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # SOURCE -> BUILD -> VALIDATE -> AUDIT MANIFEST -> DEPLOY.
      # Each stage below is one link in that chain; the validate step is what
      # stands between a degraded build and the public site.
      - name: Build deployment spatial snapshots
        id: build
        run: |
          node scripts/build_runtime_poi.mjs
          python3 scripts/fill_stays_from_esmadrid.py
          python3 scripts/build_pedestrian_activity.py

      # Writes data/deployment_manifest.json and exits non-zero when a source
      # that blocks deployment is missing, incoherent or has collapsed. A
      # non-zero exit fails the job before actions/deploy-pages runs, so GitHub
      # Pages keeps serving the previous good deployment rather than publishing
      # misleading evidence. The manifest ships with the site, so a successful
      # deployment can be audited at <site>/data/deployment_manifest.json.
      #
      # `!cancelled()` is what makes a FAILED BUILD auditable too: without it,
      # GitHub Actions would skip this step after the build step failed and no
      # manifest would exist to explain why. It is deliberately not
      # `continue-on-error`, which would mask the failure: the build step's own
      # failure already marks the job failed, and DEPLOYMENT_BUILD_OUTCOME makes
      # the validator fail as well, so a failed build can never become a
      # deployable state. Cancellation is excluded because a cancelled run has
      # nothing to audit.
      - name: Validate deployment evidence integrity
        if: ${{ !cancelled() }}
        env:
          DEPLOYMENT_BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: node scripts/validate_deployment.mjs

      # Runs even when the build or the validation failed, which is when the
      # manifest naming the failure is most useful. Only compact generated
      # artifacts are archived, never raw upstream downloads and never anything
      # carrying a secret (the CARTO key is injected in a later step).
      - name: Upload deployment evidence audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-audit
          path: |
            data/deployment_manifest.json
            data/runtime_poi.json
            data/pedestrian_activity.json
          retention-days: 30
          if-no-files-found: warn

      - uses: actions/configure-pages@v5
      - name: Inject CARTO basemap key
        env:
          CARTO_BASEMAP_KEY: ${{ secrets.CARTO_BASEMAP_KEY }}
        run: |
          node -e 'const fs=require("fs"); const config={CARTO_BASEMAP_KEY:process.env.CARTO_BASEMAP_KEY||""}; fs.writeFileSync("js/runtime-config.js","window.RUNTIME_CONFIG = "+JSON.stringify(config)+";\n");'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
