name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build deployment POI snapshot
        run: node scripts/build_runtime_poi.mjs
      - uses: actions/configure-pages@v5
      - name: Inject CARTO basemap key
        env:
          CARTO_BASEMAP_KEY: ${{ secrets.CARTO_BASEMAP_KEY }}
        run: |
          node -e 'const fs=require("fs"); const config={CARTO_BASEMAP_KEY:process.env.CARTO_BASEMAP_KEY||""}; fs.writeFileSync("js/runtime-config.js","window.RUNTIME_CONFIG = "+JSON.stringify(config)+";\n");'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
