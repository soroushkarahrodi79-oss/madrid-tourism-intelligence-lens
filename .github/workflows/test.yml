name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Tests read application source from the working tree, so they must be
    # verified on both line-ending environments, not just the Linux runner.
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms even when one fails, so a Windows-only failure
      # never hides the Linux result (or the reverse).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --test
      # "python" (not "python3") is the interpreter name actions/setup-python
      # puts on PATH on both runners; "python3" does not exist on Windows.
      - run: python -m unittest discover -s tests -p "test_*.py"

  radial-halo-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Capture UX-H1 before and after screenshots
        if: ${{ always() }}
        run: |
          BASE_REF="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git worktree add --detach ../ux-h1-main FETCH_HEAD
          UX_H1_ROOT=../ux-h1-main UX_H1_CAPTURE_ONLY=1 UX_H1_CAPTURE_DIR=${{ github.workspace }}/test-results/ux-h1-map-header/before node browser-tests/header-ux-h1.browser.mjs
          UX_H1_CAPTURE_ONLY=1 UX_H1_CAPTURE_DIR=${{ github.workspace }}/test-results/ux-h1-map-header/after node browser-tests/header-ux-h1.browser.mjs
      - name: Upload UX-H1 screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ux-h1-map-header-screenshots
          path: test-results/ux-h1-map-header
          if-no-files-found: warn

  # UX-C1: the Light-contrast regression on real WebKit (Safari engine). Same
  # assertions as Chromium; the engine is selected by UXC1_BROWSER only.
  ux-c1-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: UX-C1 contrast suite (WebKit)
        run: node --test --test-concurrency=1 browser-tests/light-contrast-ux-c1.browser.mjs
        env:
          UXC1_BROWSER: webkit
      - name: Capture iPad-landscape System-light before and after (WebKit)
        if: ${{ always() }}
        run: |
          BASE_REF="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git worktree add --detach ../ux-c1-base FETCH_HEAD
          UXC1_BROWSER=webkit UXC1_ROOT=../ux-c1-base UXC1_CAPTURE_DIR=${{ github.workspace }}/test-results/ux-c1-webkit/before node --test --test-name-pattern="capture" browser-tests/light-contrast-ux-c1.browser.mjs
          UXC1_BROWSER=webkit UXC1_CAPTURE_DIR=${{ github.workspace }}/test-results/ux-c1-webkit/after node --test --test-name-pattern="capture" browser-tests/light-contrast-ux-c1.browser.mjs
      - name: Upload UX-C1 WebKit screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ux-c1-webkit-screenshots
          path: test-results/ux-c1-webkit
          if-no-files-found: warn
