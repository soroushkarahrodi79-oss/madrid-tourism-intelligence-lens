name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Tests read application source from the working tree, so they must be
    # verified on both line-ending environments, not just the Linux runner.
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms even when one fails, so a Windows-only failure
      # never hides the Linux result (or the reverse).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --test
      # "python" (not "python3") is the interpreter name actions/setup-python
      # puts on PATH on both runners; "python3" does not exist on Windows.
      - run: python -m unittest discover -s tests -p "test_*.py"
      # Temporary PR probe: reproduce the deployment-only network path on GitHub's
      # Ubuntu runner. This step will be removed after the source route is proven.
      - name: Probe pedestrian deployment source
        if: matrix.os == 'ubuntu-latest'
        run: |
          python scripts/build_pedestrian_activity.py
          python -c "import json; d=json.load(open('data/pedestrian_activity.json', encoding='utf-8')); assert d['available']; print(d['stationCount'], d['observationCount'], d['source'].get('retrievalRoute'))"
